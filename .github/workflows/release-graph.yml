name: Release graph artifact

on:
  push:
    tags:
      - "graph-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 2026.09.21 (creates tag graph-<version>)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache raw downloads
        uses: actions/cache@v4
        with:
          path: data/cache
          key: hustring-raw-9606-v12.0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      - name: Build graph
        run: hustring build-data --enrich-gene-names --string-threshold 400 --output data/derived/graph --cache data/cache

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="graph-${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          scripts/package_graph.sh data/derived/graph "${VERSION#graph-}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --target "${{ github.sha }}" \
              --title "Prebuilt graph ${TAG#graph-}" \
              --notes "Auto-built merged interactome graph (HuRI + STRING>=700, ENSG-canonical). Unpack into data/derived/graph or point HUSTRING_GRAPH_URL at it."
          fi
