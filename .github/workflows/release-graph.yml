name: Release graph artifact

on:
  push:
    tags:
      - "graph-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache raw downloads
        uses: actions/cache@v4
        with:
          path: data/cache
          key: hustring-raw-9606-v12.0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      - name: Build graph
        run: hustring build-data --output data/derived/graph --cache data/cache

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#graph-}"
          scripts/package_graph.sh data/derived/graph "${VERSION}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "Prebuilt graph ${TAG#graph-}" \
              --notes "Auto-built merged interactome graph (HuRI + STRING>=700, ENSG-canonical). Unpack into data/derived/graph or point HUSTRING_GRAPH at it."
          fi
